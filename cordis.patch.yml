# dsh-ultra-mode bundle patch: mounts the plugin into a profile layer stack.
# Runtime defaults live at the plugin's config boundary. Users override them in
# their profile patch row with the same id.
- insert:
    - id: ultra-mode
      name: '@dsh-external/dsh-ultra-mode'
      config:
        # 模型可见工具名
        toolName: ultra_task
        # 执行路线 3/4/5，不包含独立决策路线；所有路线默认 Max
        concurrency: 3
        # 提示词段插入顺序
        sectionOrder: 117.5
        timeoutMs: 900000
        # 仅进展变化触发跨路决策；-1 不限轮数，0 关闭运行中协调
        coordinationIntervalMs: 1000
        coordinationMaxRounds: -1
        # 可选 Typesafe Jev 决策辅助；密钥只从 Host 环境变量读取
        jevEnabled: false
