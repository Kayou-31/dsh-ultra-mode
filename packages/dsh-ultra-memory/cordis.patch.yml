- insert:
    - id: ultra-memory
      name: '@dsh-external/dsh-ultra-memory'
      config:
        evidenceEnabled: true
        taskMemoryEnabled: true
        taskMemoryMaxBytes: 8192
        taskMemoryConditionalRecall: true
        taskMemoryRecallLimit: 6
        contextCompression: false
        globalKnowledge:
          enabled: false
